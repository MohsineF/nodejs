name: e2e go cache
on:
  push:
    branches: [cache-e2e]
    paths: [e2e/go/**, .github/workflows/e2e-go.yml]
env:
  AUTOPLANE_GOCACHE_VERBOSE: "1"
  # The checkout belongs to another user in container jobs.
  GOFLAGS: -buildvcs=false
defaults:
  run:
    shell: bash
    working-directory: e2e/go
jobs:
  pod:
    runs-on: go-e2e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.25", cache: false }
      - run: echo "GOCACHEPROG=${GOCACHEPROG:-unset}"
      - run: time go build ./... && go vet ./... && go test ./...
  container:
    needs: pod
    runs-on: go-e2e
    container: golang:1.25
    steps:
      - uses: actions/checkout@v5
      - run: echo "GOCACHEPROG=${GOCACHEPROG:-unset}"
      - run: time go build ./... && go vet ./... && go test ./...
  go122:
    needs: pod
    runs-on: go-e2e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.22", cache: false }
      - run: echo "GOCACHEPROG=${GOCACHEPROG:-unset}"; go version
      - run: go build ./... && go test ./...
  opt-out:
    needs: pod
    runs-on: go-e2e
    env:
      GOCACHEPROG: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.25", cache: false }
      - run: echo "GOCACHEPROG=${GOCACHEPROG:-unset}"
      - run: time go build ./... && go test ./...
